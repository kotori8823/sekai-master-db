name: Sync & Purge Directories

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  deploy-and-purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup Git Files
        run: rm -rf .git .github
      - name: Install B2 CLI
        run: pip install b2
      # ========================================================
      # 阶段 1: 存储桶同步 (Storage Sync)
      # ========================================================
      - name: Sync Files to B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          # 登录 B2
          b2 account authorize $B2_KEY_ID $B2_APP_KEY > /dev/null
          rm -rf .git .github
          b2 sync --threads 10 . b2://$B2_BUCKET_NAME/pjsk/sekai-db/jp
          
      - name: Install Rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone
          cd ..
          
          rm -rf rclone-*-linux-amd64* rclone-current-linux-amd64.zip
          rclone version
        
      - name: Sync to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          rclone sync . r2:${{ secrets.R2_BUCKET_NAME }}/pjsk/sekai-db/jp \
            --verbose \
            --transfers 32 \
            --checkers 64 \
            --exclude ".git/**" \
            --exclude ".github/**"
      - name: Install COSCMD
        run: pip install coscmd

      - name: Sync to Tencent OSS
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          BUCKET: ${{ secrets.OSS_BUCKET }}
          REGION: ${{ secrets.OSS_REGION }}
        run: |
          coscmd config -a $SECRET_ID -s $SECRET_KEY -b $BUCKET -r $REGION
          # 上传并清理远端多余文件
          coscmd upload -r . pjsk/sekai-db/jp/ --delete --ignore "*.py"

      # ========================================================
      # 阶段 2: CDN 缓存清理 (Directory Purge)
      # ========================================================
     

      - name: Purge Cloudflare Prefix
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        shell: python
        run: |
          import os, requests, json
          bucket_name = os.environ["B2_BUCKET_NAME"]

          targets = [
            f"cdn.8823.eu.org/file/{bucket_name}/pjsk/sekai-db/jp/"
          ]

          zone_id = os.environ["CF_ZONE_ID"]
          token = os.environ["CF_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache"
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }
          
          payload = { "prefixes": targets }
          
          try:
              resp = requests.post(url, headers=headers, json=payload)
              print(f"Status: {resp.status_code}")
              print(resp.text)
          except Exception as e:
              print(f"Error: {e}")

