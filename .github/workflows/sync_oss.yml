name: Sync to Backblaze B2

# 触发机制：只要 master 或 main 分支有 push 动作（包括你服务器自动 push 的）就立即执行
on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # 保留一个手动按钮，以防万一

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 只需要最新代码，加快速度

      # 2. 安装 B2 官方命令行工具
      - name: Install B2 CLI
        run: pip install b2

      # 3. 执行同步
      - name: Sync Files to B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          # 登录 B2
          b2 account authorize $B2_KEY_ID $B2_APP_KEY
          
          # 同步命令解释：
          # .                    : 代表当前仓库的所有文件
          # b2://$B2_BUCKET_NAME : 代表上传到 B2 存储桶的根目录
          # --threads 10         : 开启10线程并发上传，大量小文件时速度极快
          # --excludeRegex       : 排除 .git 文件夹和 workflow 配置本身，不上传这些垃圾文件
          
          b2 sync --threads 10 --excludeRegex '^(\.git|\.github).*' . b2://$B2_BUCKET_NAME/pjsk/sekai-db/jp
