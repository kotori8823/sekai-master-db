      - name: Purge Aliyun ESA Directory
        env:
          ALI_ID: ${{ secrets.ALI_ID }}
          ALI_SECRET: ${{ secrets.ALI_SECRET }}
          ALI_SITE_ID: ${{ secrets.ALI_SITE_ID }}
          ALI_DOMAIN: ${{ secrets.ALI_DOMAIN }}
        run: |
          pip install alibabacloud_esa20240910==2.34.0 alibabacloud_tea_openapi alibabacloud_tea_util

          python -c "
          import os
          import sys
          from alibabacloud_esa20240910.client import Client as EsaClient
          from alibabacloud_esa20240910 import models as esa_models
          from alibabacloud_tea_openapi import models as open_api_models
          from alibabacloud_tea_util import models as util_models

          try:
              config = open_api_models.Config(
                  access_key_id=os.environ['ALI_ID'],
                  access_key_secret=os.environ['ALI_SECRET']
              )
              config.endpoint = 'esa.cn-hangzhou.aliyuncs.com'
              client = EsaClient(config)

              domain = os.environ['ALI_DOMAIN']
              target_url = f'https://{domain}/sekai-db/jp/'
              print(f'Target URL: {target_url}')

              request = esa_models.PurgeCachesRequest(
                  site_id=int(os.environ['ALI_SITE_ID']),
                  type='directory',
                  content=[target_url]
              )

              runtime = util_models.RuntimeOptions()
              resp = client.purge_caches_with_options(request, runtime)
              
              print('Aliyun ESA Purge Success!')
              print(f'RequestId: {resp.body.request_id}')

          except Exception as error:
              print(f'Aliyun ESA Failed: {error}')
              if hasattr(error, 'message'):
                  print(error.message)
              sys.exit(1)
          "
